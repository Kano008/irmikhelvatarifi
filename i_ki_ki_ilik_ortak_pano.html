<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ortak Başlık Panosu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Özel renk seçici stili */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col items-center">

    <div id="loginScreen" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-gray-100 to-gray-200 p-4 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center">
            <h1 class="text-2xl font-bold mb-2 text-gray-800">Panoya Giriş</h1>
            <p class="text-sm text-gray-500 mb-6">Lütfen size verilen şifreyi girin.</p>
            
            <input type="password" id="passwordInput" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4 text-center text-lg" placeholder="Şifreniz" autocomplete="off">
            <button id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors shadow-md">Giriş Yap</button>
            <p id="loginError" class="text-red-500 text-sm mt-3 hidden">Hatalı şifre, lütfen tekrar deneyin.</p>
            
            <div class="mt-6 text-xs text-gray-400">
                İpucu: Kullanıcı 1 için 1234, Kullanıcı 2 için 5678
            </div>
        </div>
    </div>

    <div id="appScreen" class="w-full max-w-3xl hidden flex-col h-screen p-4 sm:p-6">
        
        <!-- Üst Başlık ve Kullanıcı Bilgisi -->
        <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-xl font-bold text-gray-800">Ortak Pano</h1>
                <p id="welcomeText" class="text-sm text-gray-500">Hoş geldin, <span id="currentUserLabel" class="font-semibold"></span></p>
            </div>
            <button id="logoutBtn" class="text-sm px-4 py-2 text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors font-medium">Çıkış Yap</button>
        </header>

        <!-- Renk Ayarları -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-sm font-medium text-gray-700 w-full sm:w-auto">Başlık Renkleri:</div>
            <div class="flex gap-6 w-full sm:w-auto justify-around sm:justify-end">
                <div class="flex items-center gap-2">
                    <span class="text-sm text-gray-600">Kullanıcı 1:</span>
                    <input type="color" id="colorUser1" value="#f97316" title="Kullanıcı 1 Rengini Seç">
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-gray-600">Kullanıcı 2:</span>
                    <input type="color" id="colorUser2" value="#06b6d4" title="Kullanıcı 2 Rengini Seç">
                </div>
            </div>
        </div>

        <!-- Yeni Başlık Ekleme Formu -->
        <div class="flex gap-3 mb-6 relative">
            <input type="text" id="titleInput" class="flex-1 px-5 py-4 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm text-lg" placeholder="Yeni bir başlık veya mesaj ekle...">
            <button id="addTitleBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-4 rounded-xl transition-colors shadow-md flex items-center justify-center min-w-[100px]">
                <span id="btnText">Ekle</span>
                <svg id="btnLoader" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>

        <!-- Başlıklar Listesi -->
        <div id="titlesList" class="flex-1 overflow-y-auto space-y-3 pb-4">
            <!-- Başlıklar buraya dinamik eklenecek -->
            <div class="text-center text-gray-400 mt-10">Pano şu an boş. Yeni bir başlık ekleyerek başlayın!</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, addDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global değişkenler ve Firebase kurulumu
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-shared-board-app';
        let firebaseConfig = {};
        let initialToken = null;

        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            console.warn("Firebase konfigürasyonu bulunamadı, yerel geliştirme moduna geçilebilir.");
        }
        if (typeof __initial_auth_token !== 'undefined') {
            initialToken = __initial_auth_token;
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Firestore Yolları (Zorunlu kural)
        const titlesPath = `artifacts/${appId}/public/data/titles`;
        const settingsPath = `artifacts/${appId}/public/data/settings`;

        // Uygulama Durumu
        let activeUserId = null; // 'user1' veya 'user2'
        let currentUserLabel = "";
        let authReady = false;
        let titlesData = [];
        
        // Varsayılan renkler
        let userColors = {
            'user1': '#f97316', // Turuncu
            'user2': '#06b6d4'  // Turkuaz
        };

        // DOM Elementleri
        const loginScreen = document.getElementById('loginScreen');
        const appScreen = document.getElementById('appScreen');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        
        const currentUserLabelEl = document.getElementById('currentUserLabel');
        const logoutBtn = document.getElementById('logoutBtn');
        const titleInput = document.getElementById('titleInput');
        const addTitleBtn = document.getElementById('addTitleBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const titlesList = document.getElementById('titlesList');
        
        const colorUser1Input = document.getElementById('colorUser1');
        const colorUser2Input = document.getElementById('colorUser2');

        async function initAuth() {
            try {
                if (initialToken) {
                    await signInWithCustomToken(auth, initialToken);
                } else {
                    await signInAnonymously(auth);
                }
                authReady = true;
                console.log("Firebase bağlantısı hazır.");
            } catch (error) {
                console.error("Kimlik doğrulama hatası:", error);
            }
        }
        
        initAuth();

        function handleLogin() {
            const pwd = passwordInput.value.trim();
            if (pwd === '1234') {
                activeUserId = 'user1';
                currentUserLabel = 'Kullanıcı 1';
                showApp();
            } else if (pwd === '5678') {
                activeUserId = 'user2';
                currentUserLabel = 'Kullanıcı 2';
                showApp();
            } else {
                loginError.classList.remove('hidden');
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        logoutBtn.addEventListener('click', () => {
            activeUserId = null;
            passwordInput.value = '';
            loginError.classList.add('hidden');
            appScreen.classList.add('hidden');
            appScreen.classList.remove('flex');
            loginScreen.classList.remove('hidden');
        });

        function showApp() {
            loginScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            appScreen.classList.add('flex');
            currentUserLabelEl.textContent = currentUserLabel;
            
            // Eğer kimlik doğrulama bitmişse verileri dinlemeye başla
            if (authReady) {
                startListeners();
            } else {
                // Hazır değilse bekleyip başlat
                const checkAuth = setInterval(() => {
                    if (authReady) {
                        clearInterval(checkAuth);
                        startListeners();
                    }
                }, 500);
            }
        }

        let unsubTitles = null;
        let unsubSettings = null;

        function startListeners() {
            if (!auth.currentUser) return;

            // 1. Başlıkları dinle
            const titlesCol = collection(db, titlesPath);
            unsubTitles = onSnapshot(titlesCol, (snapshot) => {
                titlesData = [];
                snapshot.forEach(doc => {
                    titlesData.push({ id: doc.id, ...doc.data() });
                });
                
                // Bellekte sırala (eski tarihliden yeniye doğru)
                titlesData.sort((a, b) => a.timestamp - b.timestamp);
                renderTitles();
            }, (error) => console.error("Başlıklar çekilirken hata:", error));

            // 2. Renk ayarlarını dinle
            const settingsCol = collection(db, settingsPath);
            unsubSettings = onSnapshot(settingsCol, (snapshot) => {
                snapshot.forEach(doc => {
                    if (doc.id === 'user1' || doc.id === 'user2') {
                        userColors[doc.id] = doc.data().color;
                    }
                });
                
                // Renk seçicileri güncelle
                colorUser1Input.value = userColors['user1'];
                colorUser2Input.value = userColors['user2'];
                
                // Renkler değiştiği için listeyi yeniden çiz
                renderTitles();
            }, (error) => console.error("Ayarlar çekilirken hata:", error));
        }

        addTitleBtn.addEventListener('click', async () => {
            const text = titleInput.value.trim();
            if (!text || !auth.currentUser || !activeUserId) return;

            // Butonu yükleniyor durumuna al
            addTitleBtn.disabled = true;
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');

            try {
                const titlesCol = collection(db, titlesPath);
                await addDoc(titlesCol, {
                    text: text,
                    authorId: activeUserId,
                    timestamp: Date.now()
                });
                titleInput.value = '';
            } catch (error) {
                console.error("Başlık eklenemedi:", error);
                alert("Başlık eklenirken bir hata oluştu.");
            } finally {
                // Butonu eski haline getir
                addTitleBtn.disabled = false;
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        });

        titleInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTitleBtn.click();
        });

        // Renk değişimi işlemleri
        async function updateColor(userId, newColor) {
            if (!auth.currentUser) return;
            try {
                const docRef = doc(db, settingsPath, userId);
                await setDoc(docRef, { color: newColor }, { merge: true });
            } catch (error) {
                console.error("Renk güncellenemedi:", error);
            }
        }

        // Renk seçicilerde değişiklik olduğunda (kullanıcı seçimi bıraktığında)
        colorUser1Input.addEventListener('change', (e) => {
            updateColor('user1', e.target.value);
        });
        colorUser2Input.addEventListener('change', (e) => {
            updateColor('user2', e.target.value);
        });

        // Arka plan rengine göre metin rengini siyah/beyaz ayarlayan yardımcı fonksiyon
        function getContrastYIQ(hexcolor){
            hexcolor = hexcolor.replace("#", "");
            if(hexcolor.length === 3) {
                hexcolor = hexcolor.split('').map(c => c+c).join('');
            }
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'text-gray-900' : 'text-white';
        }

        async function deleteTitle(id) {
             if (!auth.currentUser) return;
             try {
                 await deleteDoc(doc(db, titlesPath, id));
             } catch (error) {
                 console.error("Silme hatası:", error);
             }
        }
        
        // Silme işlemi için global fonksiyon (inline onclik için)
        window.deleteTitle = deleteTitle;

        function renderTitles() {
            titlesList.innerHTML = '';
            
            if (titlesData.length === 0) {
                titlesList.innerHTML = '<div class="text-center text-gray-400 mt-10">Pano şu an boş. Yeni bir başlık ekleyerek başlayın!</div>';
                return;
            }

            titlesData.forEach(item => {
                const bgColor = userColors[item.authorId] || '#cbd5e1'; // Varsayılan renk (eğer eşleşmezse)
                const textColorClass = getContrastYIQ(bgColor);
                const isMine = item.authorId === activeUserId;
                const authorName = item.authorId === 'user1' ? 'Kullanıcı 1' : 'Kullanıcı 2';
                
                const date = new Date(item.timestamp);
                const timeString = date.toLocaleTimeString('tr-TR', { hour: '2-digit', minute:'2-digit' });

                const wrapper = document.createElement('div');
                wrapper.className = `flex ${isMine ? 'justify-end' : 'justify-start'} w-full animate-fade-in-up`;
                
                // Kutucuk oluştur
                const box = document.createElement('div');
                box.className = `relative p-4 rounded-2xl max-w-[85%] sm:max-w-[70%] shadow-md break-words ${textColorClass}`;
                box.style.backgroundColor = bgColor;
                
                // Eğer başlık bana aitse sağ alt tarafı, değilse sol alt tarafı daha az yuvarlak yap
                if (isMine) {
                    box.classList.add('rounded-br-sm');
                } else {
                    box.classList.add('rounded-bl-sm');
                }

                box.innerHTML = `
                    <div class="text-xs opacity-75 font-semibold mb-1 flex justify-between gap-4">
                        <span>${authorName}</span>
                        <span>${timeString}</span>
                    </div>
                    <div class="text-base font-medium">${item.text}</div>
                    ${isMine ? `<button onclick="deleteTitle('${item.id}')" class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity shadow-sm" title="Sil">×</button>` : ''}
                `;
                
                // Hover durumunda silme butonunu göstermek için hover efekti
                if(isMine) {
                   box.addEventListener('mouseenter', () => { box.querySelector('button').style.opacity = '1'; });
                   box.addEventListener('mouseleave', () => { box.querySelector('button').style.opacity = '0'; });
                }

                wrapper.appendChild(box);
                titlesList.appendChild(wrapper);
            });
            
            // En alta kaydır
            titlesList.scrollTop = titlesList.scrollHeight;
        }

    </script>
    
    <style>
        /* Basit bir animasyon efekti */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }
    </style>
</body>
</html>
